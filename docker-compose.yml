services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes

  judge-server:
    image: qduoj/judge-server
    container_name: judge-server
    restart: always
    privileged: true
    environment:
      - TOKEN=123456
      - SERVICE_URL=http://judge-server:8080
      - BACKEND_URL=http://judge-api:8080/api/judge_server_heartbeat/
    ports:
      - "8080:8080"
    volumes:
      - ../judge-api/src/main/resources/test_cases:/test_case:ro
      - ../judge-api/log:/log

  judge-worker:
    build: ../judge-worker
    container_name: judge-worker
    restart: always
    depends_on:
      - kafka
      - judge-server
    environment:
      - KAFKA_BROKERS=kafka:9092
      - JUDGE_SERVER_URL=http://judge-server:8080
      - JUDGE_SERVER_TOKEN=123456
